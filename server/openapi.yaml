openapi: "3.0.3"
info:
  title: SmartPaddle API
  version: "0.1.0"
  description: REST API for SmartPaddle — table tennis paddle analytics server.

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /api/health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }

  /api/sessions:
    get:
      summary: List recent sessions
      responses:
        "200":
          description: Session list
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SessionSummary" } } } }
    post:
      summary: Create a new session
      responses:
        "200":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/CreateSessionResponse" } } }

  /api/sessions/{id}:
    get:
      summary: Get session details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }

  /api/sessions/{id}/imu:
    get:
      summary: Get IMU data for a session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: after
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 10000 }
      responses:
        "200":
          description: IMU frames
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/IMUFrame" } } } }

  /api/sessions/{id}/impacts:
    get:
      summary: Get impact events for a session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Impact events
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Impact" } } } }

  /api/calibration/sessions:
    post:
      summary: Start a new calibration session
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/StartCalibration" } } }
      responses:
        "200":
          description: Calibration session
          content: { application/json: { schema: { $ref: "#/components/schemas/CalibrationSession" } } }

  /api/calibration/{id}/points:
    post:
      summary: Add a calibration point
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/CalibrationPoint" } } }
      responses:
        "200": { description: OK }

  /api/calibration/{id}/complete:
    post:
      summary: Complete calibration and fit model
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Calibration profile
          content: { application/json: { schema: { $ref: "#/components/schemas/CalibrationProfile" } } }

  /api/impact/localize:
    post:
      summary: Localize an impact from TDOA values
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/LocalizeRequest" } } }
      responses:
        "200":
          description: Impact position
          content: { application/json: { schema: { $ref: "#/components/schemas/ImpactPosition" } } }

components:
  schemas:
    Health:
      type: object
      properties:
        status: { type: string }
    SessionSummary:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string }
        swings: { type: integer }
        duration_s: { type: integer }
    Session:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string }
        ended_at: { type: string }
        calibration_profile_id: { type: string }
        metadata: { type: string }
    CreateSessionResponse:
      type: object
      properties:
        session_id: { type: string }
    IMUFrame:
      type: object
      properties:
        ts: { type: integer }
        ax: { type: integer }
        ay: { type: integer }
        az: { type: integer }
        gx: { type: integer }
        gy: { type: integer }
        gz: { type: integer }
    Impact:
      type: object
      properties:
        ts: { type: integer }
        tdoa_ns: { type: array, items: { type: integer } }
        amplitude: { type: array, items: { type: number } }
        x_mm: { type: number }
        y_mm: { type: number }
        confidence: { type: number }
    StartCalibration:
      type: object
      properties:
        grid_size: { type: integer, default: 7 }
    CalibrationSession:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string }
        status: { type: string }
        grid_size: { type: integer }
    CalibrationPoint:
      type: object
      properties:
        grid_x: { type: number }
        grid_y: { type: number }
        tdoa_ns: { type: array, items: { type: integer } }
        tap_number: { type: integer }
    CalibrationProfile:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string }
        model_type: { type: string }
        rmse: { type: number }
    LocalizeRequest:
      type: object
      properties:
        tdoa_ns: { type: array, items: { type: integer } }
    ImpactPosition:
      type: object
      properties:
        x_mm: { type: number }
        y_mm: { type: number }
        confidence: { type: number }
