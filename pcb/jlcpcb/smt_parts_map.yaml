# JLCPCB / LCSC SMT 料号映射（跨版本共用；按 Value 增补）
#
# 下单操作见 pcb/JLCPCB_ORDERING.md。
# 键 = PCB Value（KiCad footprint Value 字段）。
# 同 Value 多封装时用 footprint_contains 或 addr_prefix 收窄。
# lcsc 为空 = 仍可进 BOM，但需人工在嘉立创选料；smt: false = 永不进 SMT。
#
# 库存会变；下单前请在 jlcpcb.com/parts 再核一次 C 号。

schema_version: 1
notes: >
  Economic SMT 只贴顶面 SMD。ESP32 / IM948 / 尾插 / PZT 线焊盘 /
  THT 轻触 / DNP 跳线一律进 hand_solder 清单，不进 BOM/CPL。

defaults:
  resistor_0603:
    footprint_contains: R_0603
    package: "0603"
  capacitor_0603:
    footprint_contains: C_0603
    package: "0603"

