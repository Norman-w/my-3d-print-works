<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- region: 导入/依赖 -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STL HTTP 预览</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
  <!-- endregion -->
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #d7dde8; }
    .app { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .floating-panel { position: absolute; top: 16px; left: 16px; z-index: 10; width: min(340px, calc(100vw - 32px)); height: min(calc(100% - 32px), 900px); border: 1px solid #243044; border-radius: 12px; padding: 10px; overflow: hidden; background: rgba(18, 23, 34, .96); box-shadow: 0 16px 40px rgba(0, 0, 0, .34); display: flex; flex-direction: column; min-width: 0; transition: width .16s ease, height .16s ease, padding .16s ease, border-radius .16s ease; }
    .view-panel { z-index: 11; width: min(280px, calc(100vw - 32px)); height: auto; max-height: min(calc(100% - 32px), 900px); }
    .tree-header { display: flex; align-items: flex-start; gap: 8px; min-height: 34px; cursor: grab; touch-action: none; user-select: none; }
    .tree-header.dragging, .view-panel-header.dragging { cursor: grabbing; }
    .view-panel-header { display: flex; align-items: center; gap: 8px; min-height: 34px; cursor: grab; touch-action: none; user-select: none; }
    .panel-title { min-width: 0; flex: 1; font-size: 15px; font-weight: 700; }
    .tree-title { min-width: 0; flex: 1; }
    .tree-title h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-collapse { flex: 0 0 28px; width: 28px; height: 28px; padding: 0; font-size: 16px; line-height: 1; }
    .panel-collapse { flex: 0 0 28px; width: 28px; height: 28px; padding: 0; font-size: 16px; line-height: 1; }
    .tree-body { min-height: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .tree-panel.dragging { transition: none; }
    .tree-panel.collapsed { width: 44px; height: 44px; padding: 6px; border-radius: 10px; }
    .tree-panel.collapsed .tree-header { min-height: 32px; }
    .tree-panel.collapsed .tree-title, .tree-panel.collapsed .tree-body { display: none; }
    .tree-panel.collapsed .tree-collapse { width: 32px; height: 32px; margin: 0; }
    .view-panel.dragging { transition: none; }
    .view-panel.collapsed { width: 44px; height: 44px; padding: 6px; border-radius: 10px; }
    .view-panel.collapsed .view-panel-header { min-height: 32px; }
    .view-panel.collapsed .panel-title, .view-panel.collapsed .view-panel-body { display: none; }
    .view-panel.collapsed .panel-collapse { width: 32px; height: 32px; margin: 0; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    .meta, .hint { color: #8b98ab; font-size: 12px; line-height: 1.5; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    button, input, select { accent-color: #5b9fd6; }
    button { background: #1c2433; color: #e8eef8; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; cursor: pointer; transition: background .16s ease, border-color .16s ease; }
    button:hover { background: #243044; }
    button:focus-visible { outline: 2px solid #f97316; outline-offset: 2px; }
    button.on { background: #f97316; border-color: #fb923c; color: #1a1208; }
    .view-panel-body { min-height: 0; overflow: auto; padding: 2px 0 2px; }
    .view-group-label { margin: 4px 2px 6px; color: #8b98ab; font-size: 11px; }
    .view-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .view-button { min-width: 0; min-height: 44px; padding: 6px 7px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .view-button-special { grid-column: 1 / -1; border-color: #c2410c; color: #fed7aa; }
    .view-button.active { background: #28506a; border-color: #5b9fd6; color: #e8f3ff; box-shadow: inset 0 0 0 1px rgba(91, 159, 214, .25); }
    button:disabled { opacity: .5; cursor: default; }
    input[type="search"], select { width: 100%; background: #1c2433; color: #e8eef8; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; }
    input[type="range"] { width: 100%; cursor: pointer; accent-color: #f97316; }
    .play { margin: 10px 0 8px; padding: 10px; border: 1px solid #243044; border-radius: 10px; background: #0f1520; }
    .play .row { margin: 8px 0 0; }
    .hz-marks { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: #8b98ab; font-variant-numeric: tabular-nums; }
    .hz-out { color: #fdba74; font-variant-numeric: tabular-nums; }
    .mechanism-status { min-height: 28px; margin-top: 8px; padding: 6px 8px; border: 1px solid #3b2f24; border-radius: 8px; color: #fed7aa; background: #171512; font-size: 12px; line-height: 1.35; }
    .filters { display: grid; gap: 8px; margin: 8px 0; }
    #parts { flex: 1; overflow: auto; padding-right: 4px; }
    .group { margin: 10px 0 14px; }
    .group h2 { display: flex; align-items: center; gap: 4px; margin: 0 0 6px; font-size: 12px; color: #93c5fd; }
    .group-toggle { display: flex; flex: 1 1 auto; width: auto; min-width: 0; align-items: center; justify-content: space-between; gap: 8px; border: 0; border-radius: 6px; padding: 4px 6px; color: #93c5fd; background: transparent; text-align: left; font-size: 12px; }
    .group-toggle:hover { background: #1c2433; }
    .group-toggle .chevron { width: 12px; color: #8b98ab; }
    .group-visibility { flex: 0 0 28px; width: 28px; height: 26px; padding: 0; color: #8b98ab; background: transparent; border-color: transparent; font-size: 15px; line-height: 1; }
    .group-visibility:hover { color: #e8eef8; background: #1c2433; border-color: #334155; }
    .group-visibility[data-state="on"] { color: #86efac; }
    .group-visibility[data-state="mixed"] { color: #fdba74; }
    .group-items { display: block; }
    .group.collapsed .group-items { display: none; }
    .tree-children { margin-left: 12px; padding-left: 9px; border-left: 1px solid #29364b; }
    .tree-part-node, .tree-info-node { min-width: 0; }
    .tree-part-row, .tree-info-row { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 3px; align-items: center; min-width: 0; }
    .node-disclosure, .node-spacer { width: 24px; height: 26px; display: inline-grid; place-items: center; padding: 0; color: #8b98ab; background: transparent; border-color: transparent; font-size: 14px; line-height: 1; }
    .node-disclosure:hover { color: #e8eef8; background: #1c2433; border-color: #334155; }
    label.part { display: grid; grid-template-columns: 18px 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-width: 0; margin: 5px 0; font-size: 13px; }
    label.part .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    label.part .status { color: #8b98ab; font-size: 11px; }
    .tree-info-row { grid-template-columns: 24px minmax(0, 1fr) auto; min-height: 26px; color: #aab6c8; font-size: 12px; }
    .tree-info-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-info-kind { color: #718096; font-size: 10px; }
    [hidden] { display: none !important; }
    #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .file-card { position: fixed; inset: 0; display: none; place-items: center; background: #0b0d12; z-index: 20; padding: 24px; }
    body.file .file-card { display: grid; }
    body.file .app { display: none; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <!-- region: 模型/类型 -->
  <!-- /api/parts: { title, units, groups, tree, parts[{id,name,file,group,role,color,opacity,visible,explosion,bytes}] } -->
  <!-- endregion -->

  <!-- region: 视图层 -->
  <div class="file-card">
    <div>
      <h1>请用本地 HTTP 打开</h1>
      <p class="hint">直接打开 HTML 会绕过预览目录，STL 相对路径也无法稳定加载。</p>
      <code>./scripts/preview_http.sh start output/3d-preview</code>
    </div>
  </div>
  <div class="app" id="preview-app">
    <aside class="floating-panel tree-panel" id="tree-panel">
      <div class="tree-header">
        <div class="tree-title">
          <h1 id="title">STL 预览</h1>
          <div class="meta" id="meta">加载零件清单…</div>
        </div>
        <button type="button" class="tree-collapse" id="tree-collapse" aria-label="折叠器件树" title="折叠器件树">‹</button>
      </div>
      <div class="tree-body">
      <label class="meta">爆炸程度 <output id="explode-out">0</output>%</label>
      <input id="explode-range" type="range" min="0" max="100" value="0" />
      <div class="play">
        <label class="meta" for="hz-range">链条循环 <output class="hz-out" id="hz-out">1 Hz · 顺时针</output></label>
        <input id="hz-range" type="range" min="0" max="5" step="1" value="2" />
        <div class="hz-marks" aria-hidden="true">
          <span>0.1</span><span>0.5</span><span>1</span><span>2</span><span>5</span><span>10</span>
        </div>
        <div class="mechanism-status" id="scheme1-status" role="status" aria-live="polite">运动契约加载中…</div>
        <div class="row">
          <button type="button" id="fwd" class="on">正转</button>
          <button type="button" id="stop">停止</button>
          <button type="button" id="rev">反转</button>
        </div>
      </div>
      <div class="filters">
        <input id="part-search" type="search" placeholder="搜索零件名 / 分组 / 文件" />
        <select id="group-filter" aria-label="按分组筛选">
          <option value="">全部分组</option>
        </select>
        <select id="role-filter" aria-label="按角色筛选">
          <option value="">全部角色</option>
          <option value="printed">printed</option>
          <option value="purchased">purchased</option>
          <option value="diagnostic">diagnostic</option>
        </select>
      </div>
      <div class="row">
        <button type="button" id="load-filtered">加载筛选结果</button>
        <button type="button" id="hide-filtered">隐藏筛选结果</button>
      </div>
      <div id="parts"></div>
      </div>
    </aside>
    <aside class="floating-panel view-panel" id="view-panel">
      <div class="view-panel-header">
        <div class="panel-title">视角</div>
        <button type="button" class="panel-collapse" id="views-toggle" aria-expanded="true" aria-label="折叠视角" title="折叠视角">
          <span class="chevron" id="views-chevron">‹</span>
        </button>
      </div>
      <div class="view-panel-body" id="views-body">
        <div class="view-group-label">标准</div>
        <div class="view-grid">
          <button type="button" class="view-button" data-view="front" aria-pressed="false">正视图</button>
          <button type="button" class="view-button" data-view="left" aria-pressed="false">左视图</button>
          <button type="button" class="view-button" data-view="rear" aria-pressed="false">后视图</button>
          <button type="button" class="view-button" data-view="iso" aria-pressed="false">等轴视图</button>
        </div>
        <div class="view-group-label">机构</div>
        <div class="view-grid">
          <button type="button" class="view-button" data-view="snake" aria-pressed="false">蛇形结构</button>
          <button type="button" class="view-button" data-view="drawer-drive" aria-pressed="false">开合驱动</button>
          <button type="button" class="view-button" data-view="upper-tensioner" aria-pressed="false">上方张紧</button>
          <button type="button" class="view-button" data-view="lower-tensioner" aria-pressed="false">下方张紧</button>
        </div>
        <div class="view-group-label">首件检查</div>
        <div class="view-grid">
          <button type="button" class="view-button view-button-special" data-view="center-clutch" aria-pressed="false" title="聚焦中心 R3C3：输入公轮、输出母轮、滑架、导轨、止挡、机构板与磁力靴">中心离合 · R3C3</button>
          <button type="button" class="view-button view-button-special" id="center-clutch-demo" title="播放中心 R3C3：开位 → 永磁接合 → 保持 → 永磁释放 → 开位">▶ 播放离合开合</button>
        </div>
      </div>
    </aside>
    <canvas id="c"></canvas>
  </div>
    <script type="module" src="./app.js?v=center-clutch-view-6"></script>
  <!-- endregion -->
</body>
</html>
