<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartPartsDrawer · FreeCAD STL 预览</title>
  <style>
    :root {
      --bg: #0b1118;
      --panel: rgba(19, 28, 38, 0.94);
      --line: rgba(130, 146, 166, 0.34);
      --muted: #9fb1c0;
      --text: #f4f6fb;
      --accent: #d9ff62;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: radial-gradient(circle at 60% -10%, rgba(120, 216, 255, .11), transparent 32%), var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Segoe UI", Arial, sans-serif;
      height: 100%;
    }
    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
      gap: 14px;
      padding: 14px;
    }
    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 14px;
      padding: 14px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: .02em;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .row .label {
      color: var(--muted);
      min-width: 88px;
      font-size: 12px;
    }
    button, select, input {
      min-height: 32px;
      border: 1px solid rgba(170, 186, 205, .45);
      background: rgba(9, 16, 23, .88);
      color: var(--text);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 12px;
    }
    button.primary {
      background: var(--accent);
      color: #162011;
      border-color: transparent;
      font-weight: 600;
    }
    .model-list {
      margin: 12px 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      max-height: 290px;
      overflow: auto;
    }
    .model-list label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 6px;
    }
    .model-list label + label { border-top: 1px solid rgba(130, 146, 166, .14); }
    .status {
      margin-top: 8px;
      color: #d6e1ea;
      font-size: 11px;
      min-height: 24px;
    }
    .viewer {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      min-height: 540px;
      background: linear-gradient(160deg, #0e1622, #060a10 72%);
    }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute;
      left: 10px;
      top: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
      font-size: 11px;
      color: rgba(240, 244, 250, .76);
    }
    .hint { color: rgba(220, 228, 237, .75); }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel">
      <h1>FreeCAD STL 展示页</h1>
      <div class="meta" id="meta">加载中...</div>
      <div class="row">
        <span class="label">显示模式:</span>
        <button id="fit" class="primary">重置视角</button>
        <button id="reload">刷新模型</button>
      </div>
      <div class="row">
        <span class="label">旋转:</span>
        <input id="autoplay" type="checkbox" checked />
        <label for="autoplay" style="font-size:12px; color:#cfd8e0;">自动慢转</label>
      </div>
      <div class="row">
        <span class="label">速度:</span>
        <input id="speed" type="range" min="0.2" max="2.5" value="0.8" step="0.1" />
        <span id="speedLabel">0.8x</span>
      </div>
      <div class="row">
        <span class="label">视图:</span>
        <select id="preset">
          <option value="all">整体</option>
          <option value="cabinet">只看底箱体</option>
          <option value="drawers">只看抽屉组</option>
          <option value="selector">只看机构选择区</option>
          <option value="drive">只看驱动结构</option>
        </select>
      </div>
      <div class="model-list" id="modelList"></div>
      <details style="margin-top:8px">
        <summary style="font-size:12px; color:#d2dceb;">机制映射（mechanismMap）</summary>
        <pre id="mechanismMap" style="margin:8px 0 0; max-height:220px; overflow:auto; background:#070f17; border:1px solid var(--line); padding:8px; border-radius:8px; color:#c9d5e5; font-size:11px; line-height:1.4;"></pre>
      </details>
      <div class="status" id="status">请先从脚本导出 manifest 与 STL。</div>
    </section>
    <section class="viewer">
      <div class="hud">
        <span class="hint">左键拖拽旋转，滚轮缩放，拖动滑块调速</span>
      </div>
      <canvas id="c"></canvas>
    </section>
  </div>

  <script type="module">
    import * as THREE from "./js/three.module.js";
    import { OrbitControls } from "./jsm/OrbitControls.js";
    import { STLLoader } from "./jsm/STLLoader.js";

    const state = {
      scene: null,
      camera: null,
      renderer: null,
      controls: null,
      models: [],
      manifest: null,
      preset: "all",
      autoRotate: true,
      rotateSpeed: 0.8,
      selectedByName: new Set(),
    };

    const els = {
      meta: document.getElementById("meta"),
      mechanismMap: document.getElementById("mechanismMap"),
      modelList: document.getElementById("modelList"),
      status: document.getElementById("status"),
      fit: document.getElementById("fit"),
      reload: document.getElementById("reload"),
      autoplay: document.getElementById("autoplay"),
      speed: document.getElementById("speed"),
      speedLabel: document.getElementById("speedLabel"),
      preset: document.getElementById("preset"),
    };

    function parseRgb(hex) {
      const v = hex.replace("#", "");
      const n = parseInt(v, 16);
      return new THREE.Color(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
    }

    function initThree() {
      const canvas = document.getElementById("c");
      state.scene = new THREE.Scene();
      state.camera = new THREE.PerspectiveCamera(42, canvas.clientWidth / Math.max(1, canvas.clientHeight), 0.1, 4000);
      state.camera.position.set(240, 140, 240);
      state.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      state.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      state.renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
      state.renderer.outputColorSpace = THREE.SRGBColorSpace;
      state.scene.add(new THREE.HemisphereLight(0xbfdcff, 0x111a20, 1.2));
      const key = new THREE.DirectionalLight(0xffffff, 1.1);
      key.position.set(20, 30, 12);
      state.scene.add(key);
      const fill = new THREE.DirectionalLight(0x9fd3ff, 0.45);
      fill.position.set(-10, 8, -8);
      state.scene.add(fill);
      state.controls = new OrbitControls(state.camera, canvas);
      state.controls.enableDamping = true;
      state.controls.dampingFactor = 0.08;
      state.controls.autoRotate = true;
      state.controls.autoRotateSpeed = 1.0;
      state.scene.fog = new THREE.Fog(0x05080d, 100, 1200);
      animate();
      window.addEventListener("resize", onResize);
    }

    function onResize() {
      const canvas = document.getElementById("c");
      if (!state.camera || !state.renderer) return;
      state.camera.aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
      state.camera.updateProjectionMatrix();
      state.renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
    }

    function clearModels() {
      for (const entry of state.models) {
        if (entry.mesh && entry.mesh.parent) {
          entry.mesh.parent.remove(entry.mesh);
        }
      }
      state.models = [];
    }

    function addModel(name, item, geometry) {
      const material = new THREE.MeshStandardMaterial({
        color: parseRgb(item.color || "#9ab2c9"),
        roughness: 0.34,
        metalness: 0.12,
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.castShadow = false;
      mesh.receiveShadow = false;
      mesh.visible = item.visible;
      state.scene.add(mesh);
      state.models.push({ mesh, source: item });
    }

    async function loadManifest() {
      try {
        const response = await fetch("./assets/stl/manifest.json", { cache: "no-cache" });
        if (!response.ok) {
          throw new Error(`manifest 获取失败: ${response.status} ${response.statusText}`);
        }
        const manifest = await response.json();
        state.manifest = manifest;
        renderModelList(manifest.models || []);
        renderMeta(manifest);
        await loadModels(manifest.models || []);
        applyPreset(state.preset);
        fitView(false);
      } catch (err) {
        els.status.textContent = `加载 manifest 失败：${String(err && err.message || err)}`;
        console.error(err);
      }
    }

    function renderMeta(manifest) {
      const source = manifest.config || {};
      els.meta.textContent = `模型: ${source.columns || 0}列 × ${source.layers || 0}层，选择结构: ${source.selectorMode || "snake"}（${source.widthTotal || 0} × ${source.depthTotal || 0}）`;
      const map = manifest.mechanismMap || null;
      if (els.mechanismMap) {
        els.mechanismMap.textContent = map ? JSON.stringify(map, null, 2) : "未检测到 mechanismMap";
      }
    }

    function renderModelList(items) {
      state.selectedByName = new Set(items.filter((i) => i.visible).map((i) => i.name));
      els.modelList.innerHTML = "";
      for (const item of items) {
        const line = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = !!item.visible;
        checkbox.dataset.name = item.name;
        checkbox.addEventListener("change", () => {
          item.visible = checkbox.checked;
          state.selectedByName = new Set(items.filter((m) => m.visible).map((m) => m.name));
          for (const entry of state.models) {
            if (entry.source.name === item.name) {
              entry.mesh.visible = item.visible;
            }
          }
        });
        line.appendChild(checkbox);
        line.append(` ${item.displayName || item.name} (${item.file})`);
        els.modelList.appendChild(line);
      }
    }

    async function loadModels(items) {
      clearModels();
      const loader = new STLLoader();
      for (const item of items) {
        try {
          const geometry = await loader.loadAsync(`./assets/stl/${item.file}`);
          geometry.computeBoundingBox();
          geometry.computeVertexNormals();
          addModel(item.name, item, geometry);
        } catch (err) {
          console.warn("模型加载失败:", item.file, err);
        }
      }
      const count = state.models.length;
      els.status.textContent = count > 0 ? `加载完成：${count} 个 STL 模型。` : "未加载到 STL 文件。";
    }

    function fitView(animate = true) {
      if (!state.camera || !state.controls || state.models.length === 0) {
        return;
      }
      const box = new THREE.Box3();
      let has = false;
      for (const entry of state.models) {
        if (!entry.mesh.visible) continue;
        entry.mesh.geometry.computeBoundingBox();
        const b = new THREE.Box3().setFromObject(entry.mesh);
        if (!has) {
          box.copy(b);
          has = true;
        } else {
          box.union(b);
        }
      }
      if (!has) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = state.camera.fov * Math.PI / 180;
      const cameraDist = Math.abs(maxDim / (2 * Math.tan(fov / 2)));
      const direction = new THREE.Vector3(1, 0.8, 1).normalize();
      state.camera.position.copy(center).add(direction.multiplyScalar(cameraDist * 1.15));
      state.controls.target.copy(center);
      state.camera.near = Math.max(0.1, cameraDist / 30);
      state.camera.far = Math.max(500, cameraDist * 10);
      state.camera.updateProjectionMatrix();
      if (!animate) {
        state.controls.update();
      }
    }

    function applyPreset(name) {
      if (!state.manifest || !state.manifest.models) return;
      const set = state.manifest.models;
      for (const model of set) {
        if (name === "all") {
          model.visible = model.name !== "all";
        } else {
          model.visible = model.name === name || model.name === "all" && false;
        }
      }
      renderModelList(set);
      for (const entry of state.models) {
        const found = set.find((m) => m.name === entry.source.name);
        entry.mesh.visible = found ? !!found.visible : false;
      }
      fitView(false);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (state.controls) {
        state.controls.autoRotate = state.autoRotate;
        state.controls.autoRotateSpeed = 0.45 * state.rotateSpeed;
        state.controls.update();
      }
      state.renderer.render(state.scene, state.camera);
    }

    function bindEvents() {
      els.fit.addEventListener("click", () => fitView(true));
      els.reload.addEventListener("click", loadManifest);
      els.autoplay.addEventListener("change", () => {
        state.autoRotate = els.autoplay.checked;
      });
      els.speed.addEventListener("input", () => {
        state.rotateSpeed = Number(els.speed.value);
        els.speedLabel.textContent = `${state.rotateSpeed.toFixed(1)}x`;
      });
      els.preset.addEventListener("change", () => {
        state.preset = els.preset.value;
        applyPreset(state.preset);
      });
      state.autoRotate = !!els.autoplay.checked;
      state.rotateSpeed = Number(els.speed.value);
      els.speedLabel.textContent = `${state.rotateSpeed.toFixed(1)}x`;
    }

    initThree();
    bindEvents();
    loadManifest();
  </script>
</body>
</html>
