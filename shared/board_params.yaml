# DEPRECATED — 旧 V3 柔性板参数快照，勿再用于刚性 PCB 下单/采购/固件脚位。
# 现行电源/半孔/GPIO 以 pcb/main.ato + firmware/main/config.h 为准。
# 保留本文件仅供历史对照；新工作请改 enclosure/parameters.scad / pcb 流水线产物。
#
# SmartPaddle — 从 OpenSCAD parameters.scad 提取的 FPC 布局参数
# 自动生成，与 enclosure/parameters.scad 保持同步
# 所有坐标单位：mm，坐标系原点同 SCAD (椭圆中心 Y=0)

board:
  type: flex_2layer
  outline_source: bezier
  source_file: web/src/data/userBezierProfiles.json
  y_range: [-103.5, 78.5]
  x_range: [-74.2, 74.2]
  max_half_width: 74.2
  wall_thickness: 2.0
  parting_plane_z: 0                  # 所有元件共面在分型面
  blade_tip_y: 78.5
  shoulder_bottom_y: -78.5

  # 拍面贝塞尔闭合多边形（90 pts, 仅 Y≥-78.5）
  bezier_blade_poly: [[0.00,78.50],[2.63,78.38],[5.61,78.20],[8.89,77.90],[12.43,77.43],[16.21,76.74],[20.19,75.78],[24.33,74.49],[28.59,72.83],[32.95,70.74],[37.37,68.16],[41.81,65.05],[46.24,61.36],[50.62,57.03],[54.91,52.02],[59.09,46.26],[63.11,39.71],[65.00,35.67],[66.71,31.54],[68.24,27.32],[69.59,23.01],[70.76,18.62],[71.76,14.16],[72.58,9.64],[73.23,5.05],[73.72,0.40],[74.03,-4.30],[74.17,-9.05],[74.15,-13.83],[73.96,-18.66],[73.61,-23.51],[73.10,-28.39],[72.43,-33.28],[71.68,-37.31],[70.80,-41.28],[69.75,-45.18],[68.49,-48.99],[66.99,-52.73],[65.23,-56.38],[63.16,-59.93],[60.76,-63.38],[57.99,-66.72],[54.82,-69.95],[51.21,-73.06],[47.13,-76.04],[-47.13,-76.04],[-51.21,-73.06],[-54.82,-69.95],[-57.99,-66.72],[-60.76,-63.38],[-63.16,-59.93],[-65.23,-56.38],[-66.99,-52.73],[-68.49,-48.99],[-69.75,-45.18],[-70.80,-41.28],[-71.68,-37.31],[-72.43,-33.28],[-73.10,-28.39],[-73.61,-23.51],[-73.96,-18.66],[-74.15,-13.83],[-74.17,-9.05],[-74.03,-4.30],[-73.72,0.40],[-73.23,5.05],[-72.58,9.64],[-71.76,14.16],[-70.76,18.62],[-69.59,23.01],[-68.24,27.32],[-66.71,31.54],[-65.00,35.67],[-63.11,39.71],[-59.09,46.26],[-54.91,52.02],[-50.62,57.03],[-46.24,61.36],[-41.81,65.05],[-37.37,68.16],[-32.95,70.74],[-28.59,72.83],[-24.33,74.49],[-20.19,75.78],[-16.21,76.74],[-12.43,77.43],[-8.89,77.90],[-5.61,78.20],[-2.63,78.38],[0.00,78.50]]

  # FPC 约束
  min_trace_width: 0.2                # mm — 模拟信号走线
  min_clearance: 0.2
  copper_weight: 1                    # oz
  base_material: polyimide
  base_thickness: 0.1                 # mm

components:
  # ═══ PZT-5A 压电陶瓷片 ═══
  piezo:
    - id: PZT_TR
      position: [38, 52]
      diameter: 20.0                  # PZT 实际直径
      cavity_diameter: 20.5           # SCAD 槽径（含容差）
      electrode: ring                 # 环形焊盘模式
    - id: PZT_TL
      position: [-38, 52]
      diameter: 20.0
      cavity_diameter: 20.5
      electrode: ring
    - id: PZT_BR
      position: [44, -52]
      diameter: 20.0
      cavity_diameter: 20.5
      electrode: ring
    - id: PZT_BL
      position: [-44, -52]
      diameter: 20.0
      cavity_diameter: 20.5
      electrode: ring

  # ═══ 信号调理电路（0603 电阻 + SOT-23-3 BAT54S 双肖特基） ═══
  # 位置从 PZT 中心向 MCU 汇聚点 (0, -5) 偏移
  # 公式: angle = atan2(hub_y - pzt_y, hub_x - pzt_x)
  #       offset = piezo_disc_d/2 + resistor_ear_l/2 - 2 (2mm overlap)
  #       ear = pzt + offset * (cos(angle), sin(angle))
  signal_conditioning:
    - piezo: PZT_TR
      r_position: [32.30, 43.30]      # 1MΩ 0603 电阻位
      d_position: [33.80, 45.30]      # BAT54S SOT-23-3 二极管位
      resistor_value: 1M              # 并联电阻
      diode_type: BAT54S              # 双肖特基钳位
    - piezo: PZT_TL
      r_position: [-32.30, 43.30]
      d_position: [-33.80, 45.30]
      resistor_value: 1M
      diode_type: BAT54S
    - piezo: PZT_BR
      r_position: [36.50, -44.50]
      d_position: [38.00, -46.50]
      resistor_value: 1M
      diode_type: BAT54S
    - piezo: PZT_BL
      r_position: [-36.50, -44.50]
      d_position: [-38.00, -46.50]
      resistor_value: 1M
      diode_type: BAT54S

  # ═══ 主控模块（ESP32-C6 + IM948 IMU） ═══
  main_module:
    center: [0, -5]
    size: [42, 42]                    # PCB 槽尺寸
    footprint_width: 18               # ESP32-C6 模块宽 (X方向)
    footprint_height: 25.5            # ESP32-C6 模块高 (Y方向)
    imu_width: 13                     # IM948 模块宽 (X方向)
    imu_height: 18.5                  # IM948 模块高 (Y方向)
    description: "ESP32-C6-WROOM-1-N8 (18×25.5mm, 28邮票孔) + IM948 IMU (13×18.5mm, 16邮票孔) 纵排"

  # ═══ 可选退耦电容 (ESP32-C6 模组自带，FPC 上暂不放置) ═══
  # 若后续 ADC 噪声大，可在 MCU 连接器 VCC 旁手贴 1×100nF 0603
  decoupling_caps: []                 # 当前留空 — 模组已含必要退耦

  # ═══ ADC 输入保护 (BAT54S 箝位已提供，无需额外电阻) ═══
  adc_protection: []

nets:
  # 电源网络
  power:
    vcc: "3.3V"
    gnd: "GND"

  # 模拟信号网络 — 每路 PZT 独立通道
  piezo_signals:
    - name: PZT_TR_SIGNAL
      piezo: PZT_TR
      channel: ADC0                   # ESP32-C6 ADC1_CH0 (GPIO0)
    - name: PZT_TL_SIGNAL
      piezo: PZT_TL
      channel: ADC1                   # ESP32-C6 ADC1_CH1 (GPIO1)
    - name: PZT_BR_SIGNAL
      piezo: PZT_BR
      channel: ADC2                   # ESP32-C6 ADC1_CH2 (GPIO2)
    - name: PZT_BL_SIGNAL
      piezo: PZT_BL
      channel: ADC3                   # ESP32-C6 ADC1_CH3 (GPIO3)

  # 数字接口
  digital:
    - name: UART_RX
      description: "ESP32 IO17 ← IM948 TXD (14)"
    - name: UART_TX
      description: "ESP32 IO16 → IM948 RXD (13)"
    - name: USB_D+
      description: "ESP32 IO19 引出"
    - name: USB_D-
      description: "ESP32 IO18 引出"

keep_out_zones:
  # 螺丝孔位 — FPC 必须避让
  - type: screw_holes
    clearance_radius: 3.5             # screw_d_boss(5.5)/2 + margin
    positions:
      - [0, 65]                       # 拍尖正中
      - [52, 45]                      # 右上
      - [-52, 45]                     # 左上
      - [55, 0]                       # 右中
      - [-55, 0]                      # 左中
      - [36, -65]                     # 右下
      - [-36, -65]                    # 左下
      - [0, 24]                       # PCB 上方
      - [0, -33]                      # PCB 下方

  # 定位销孔
  - type: pin_holes
    clearance_radius: 2.5             # pin_d(3.0)/2 + margin
    positions:
      - [45, 40]
      - [-45, 40]
      - [48, -30]
      - [-48, -30]

stiffeners:
  # 元件贴装区需 FR4 加强片
  - zone: PZT_pads_all
    description: "4 片 PZT 环形焊盘区域，各 25×25mm"
  - zone: signal_conditioning
    description: "4 组 0603+SOT-23-3 元件区，各 12×8mm"
  - zone: main_module_connector
    description: "ESP32-C6 模块连接器区，50×50mm"

coverlay_openings:
  - zone: PZT_electrodes
    description: "PZT 电极接触面 (Ø20.5mm × 4)，ENIG 表面处理"
  - zone: connector_fingers
    description: "ESP32-C6 模块连接器金手指"
