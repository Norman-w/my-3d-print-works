<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SmartPaddle M5 — 尾板干涉预览</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { margin: 0; background: #0b0d12; color: #d7dde8; }
  #bar { display:flex; gap:8px; flex-wrap:wrap; padding:10px 12px; align-items:center;
         border-bottom:1px solid #243044; background:#121722; }
  button { background:#1c2433; color:#e8eef8; border:1px solid #334155; border-radius:8px;
           padding:6px 10px; cursor:pointer; }
  button.on { background:#2563eb; border-color:#3b82f6; }
  #c { width:100vw; height:calc(100vh - 52px); display:block; }
  #hint { opacity:.7; font-size:12px; margin-left:auto; }
</style>
</head>
<body>
<div id="bar">
  <strong>M5 尾板</strong>
  <button data-k="shell" class="on">拍柄尾段</button>
  <button data-k="board">板槽外形</button>
  <button data-k="ui">UI 开孔</button>
  <button data-k="all">全部</button>
  <span id="hint">需 HTTP：./scripts/preview-m5.sh · 无电池匣</span>
</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const files = {
  shell: 'build/m5_handle_tail.stl',
  board: 'build/m5_tail_board_slot.stl',
  ui: 'build/m5_tail_ui_cuts.stl',
};
const colors = { shell: 0x8b93a7, board: 0x22c55e, ui: 0xf59e0b };
const meshes = {};
let mode = 'shell';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);
const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
cam.position.set(45, -70, 35);
const controls = new OrbitControls(cam, canvas);
controls.target.set(0, -150, 0);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(40, -20, 60);
scene.add(key);

const loader = new STLLoader();
async function load(key) {
  const geo = await new Promise((res, rej) => loader.load(files[key], res, undefined, rej));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    color: colors[key],
    metalness: 0.1,
    roughness: 0.55,
    transparent: key !== 'shell',
    opacity: key === 'shell' ? 1 : 0.75,
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  meshes[key] = mesh;
}

function applyMode() {
  const show = {
    shell: mode === 'shell' || mode === 'all',
    board: mode === 'board' || mode === 'all',
    ui: mode === 'ui' || mode === 'all',
  };
  for (const k of Object.keys(meshes)) meshes[k].visible = !!show[k];
  document.querySelectorAll('#bar button[data-k]').forEach(b => {
    b.classList.toggle('on', b.dataset.k === mode);
  });
}

document.querySelectorAll('#bar button[data-k]').forEach(b => {
  b.onclick = () => { mode = b.dataset.k; applyMode(); };
});

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w / h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function tick() {
  controls.update();
  renderer.render(scene, cam);
  requestAnimationFrame(tick);
}
tick();

try {
  await Promise.all(['shell','board','ui'].map(load));
  applyMode();
} catch (e) {
  document.getElementById('hint').textContent =
    '加载失败：先跑 export-m5-preview.sh 与 step6，并用 HTTP 打开';
  console.error(e);
}
</script>
</body>
</html>
