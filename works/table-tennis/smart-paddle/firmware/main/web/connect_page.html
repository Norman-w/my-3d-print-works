<!DOCTYPE html>
<html lang="en">
<head><title>WiFi 配置 — SmartPaddle</title>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>body {
        font-family: sans-serif;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0
    }

    form {
        background-color: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, .1);
        width: 300px
    }

    h1 {
        text-align: center;
        color: #333
    }

    label {
        display: block;
        margin-bottom: .5rem;
        color: #555
    }

    input[type=text], input[type=password] {
        width: 100%;
        padding: .5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        margin-bottom: 1rem
    }

    input[type=submit] {
        width: 100%;
        background-color: #4CAF50;
        color: white;
        padding: .7rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem
    }

    input[type=submit]:hover {
        background-color: #45a049
    }</style>
</head>
<body>
<form action='/login' method='post'><h1>SmartPaddle 配网</h1>
    <label for='ssid'>WiFi 名称 (SSID)</label><input type='text' id='ssid' name='ssid' required>
    <label for='password'>密码</label><input type='password' id='password' name='password'>
    <label for='device_id'>设备编号 (.local)</label><input type='text' id='device_id' name='device_id' value='{{DEVICE_ID}}' required>
    <input type='submit' value='连接'></form>
</body>
</html>
