requires-atopile: "0.12.5"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: main.ato:SmartPaddleRigid
    paths:
      # Keep Atopile away from the routed manufacturing PCB.  Version 0.12.5
      # can rewrite the internal geometry of flipped B.Cu footprints while
      # still reporting success; all logical builds go to this unrouted stage.
      layout: ./layouts/staging/default.atopile.kicad_pcb
